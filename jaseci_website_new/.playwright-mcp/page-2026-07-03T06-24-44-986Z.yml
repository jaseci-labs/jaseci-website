        - paragraph [ref=f2e388]: Dennis Ritchie’s philosophy of why he built the C was the idea that people should spend their time coding something innovative, nothing else. His instinct was to take away the boilerplate, like registers, that stood between us and human ideation. We want to replicate that same philosophy over 50 years ago, and take away that boilerplate and give devs more time.
