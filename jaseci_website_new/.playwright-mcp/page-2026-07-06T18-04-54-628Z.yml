        - 'heading "GraphMend: Code Transformations for Fixing Graph Breaks in PyTorch 2" [level=2] [ref=f3e42]'
        - paragraph [ref=f3e43]:
          - strong [ref=f3e44]: GraphMend
          - text: addresses
          - emphasis [ref=f3e45]: graph breaks
          - text: in PyTorch 2, where unsupported Python ops or dynamic control flow force eager fallbacks, CPU–GPU syncs, and performance loss. It automatically fixes graph breaks at the source level, enabling larger uninterrupted graphs without manual rewrites through code transformations.
        - paragraph [ref=f3e46]: "It introduces two techniques:"
        - list [ref=f3e47]:
          - listitem [ref=f3e48]:
            - strong [ref=f3e49]: Predicated Dynamic Control Flow
            - text: ": Converts Python branches into tensor ops."
          - listitem [ref=f3e50]:
            - strong [ref=f3e51]: Graph-Epilogue Deferred Side Effects
            - text: ": Defers Python I/O until after execution."
        - paragraph [ref=f3e52]:
          - strong [ref=f3e53]: Key Results
        - list [ref=f3e54]:
          - listitem [ref=f3e55]: Delivers 30–75% lower latency, 2.5–25% faster execution, and 5–8% higher throughput on RTX 3090 and A40.
        - generic [ref=f3e56]:
          - figure [ref=f3e57]
          - paragraph [ref=f3e59]:
            - strong [ref=f3e60]: Integration
            - text: In the Jac pipeline, GraphMend analyzes entry points, detects breaks, and applies AST transformations before lowering code into the unified IR (UniiR).
        - link "Arxiv" [ref=f3e63] [cursor=pointer]:
          - /url: https://arxiv.org/abs/2509.16248
      - paragraph
      - generic [ref=f3e65]:
        - 'heading "MTP: A Meaning-Typed Language Abstraction for AI-Integrated Programming" [level=2] [ref=f3e66]'
        - paragraph [ref=f3e67]: The rise of generative AI and large language models (LLMs) is transforming how we build applications. While powerful, integrating LLMs into software today often requires manual prompt engineering, complex output parsing, and error handling, tasks that increase developer burden and reduce productivity.
        - paragraph [ref=f3e68]:
          - strong [ref=f3e69]: Meaning-Typed Programming (MTP)
          - text: introduces a new paradigm that treats LLM integration as a natural part of programming rather than an external add-on. Instead of requiring developers to handcraft prompts, MTP leverages the
          - strong [ref=f3e70]: semantic richness already present in code
          - text: ; function names, variable types, and class structures—to automatically generate prompts and interpret responses.
        - generic [ref=f3e71]:
          - figure [ref=f3e72]
          - generic [ref=f3e73]:
            - paragraph [ref=f3e74]: "MTP is enabled by three core components:"
            - paragraph [ref=f3e75]:
              - strong [ref=f3e76]:
                - text: The
                - code [ref=f3e77]: by
                - text: operator
              - text: ", a simple language-level construct that allows seamless invocation of LLMs directly within code."
            - paragraph [ref=f3e78]:
              - strong [ref=f3e79]: Meaning-Typed Intermediate Representation (MT-IR)
              - text: ", which captures the semantics of code at compile time for use in prompt generation."
            - paragraph [ref=f3e80]:
              - strong [ref=f3e81]: MT-Runtime
              - text: ", an execution engine that dynamically synthesizes prompts, manages LLM interactions, and ensures type-safe response handling."
        - paragraph [ref=f3e82]:
          - text: Implemented in
          - strong [ref=f3e83]: Jac
          - text: ", a production-grade Python superset, MTP dramatically reduces development overhead. In extensive evaluations, developers using MTP completed tasks"
          - strong [ref=f3e84]: 3.2× faster with 45% fewer lines of code
          - text: compared to existing frameworks. MTP also improved runtime efficiency and lowered inference costs by up to
          - strong [ref=f3e85]: 4.5×
          - text: ", while maintaining or exceeding accuracy across benchmarks. Even under suboptimal coding practices (e.g., poor variable naming), MTP proved resilient, preserving high accuracy"
        - paragraph [ref=f3e86]:
          - text: By rethinking how programming languages interact with LLMs, MTP provides a
          - strong [ref=f3e87]: scalable, efficient, and intuitive foundation for AI-integrated applications
          - text: .
        - paragraph [ref=f3e88]:
          - text: Paper Accepted to
