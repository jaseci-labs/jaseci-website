        - 'heading "GraphRunner: Efficient and Accurate Graph-Based Retrieval" [level=2] [ref=f3e100]'
        - paragraph [ref=f3e101]:
          - strong [ref=f3e102]: GraphRunner
          - text: is a three-stage RAG framework;
          - strong [ref=f3e103]: planning, verification, execution
          - text: ", tailored for structured datasets like knowledge graphs, where conventional RAG struggles with inefficiency, reasoning errors, and hallucinations. Instead of step-by-step reasoning, GraphRunner introduces high-level traversal actions for multi-hop exploration and shared neighbor detection, then verifies plans against the graph before execution."
        - paragraph [ref=f3e104]:
          - strong [ref=f3e105]: Key Results
        - list [ref=f3e106]:
          - listitem [ref=f3e107]: Holistic planning decoupled from execution reduces token use and error propagation.
          - listitem [ref=f3e108]: Verification prevents hallucinations and wasted computation.
          - listitem [ref=f3e109]:
            - text: Delivers
            - strong [ref=f3e110]: 3–12.9× lower cost
            - text: ","
            - strong [ref=f3e111]: 2.5–7.1× faster responses
            - text: ", and"
            - strong [ref=f3e112]: 10–50% higher accuracy
            - text: across domains (academic, e-commerce, healthcare, legal, literature) compared to other existing techniques.
        - paragraph [ref=f3e113]: GraphRunner shows that rethinking retrieval for knowledge graphs improves both accuracy and scalability.
