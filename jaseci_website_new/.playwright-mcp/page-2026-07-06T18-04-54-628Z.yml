      - generic [ref=f3e120]:
        - 'heading "Ranking Unraveled: Recipes for LLM Rankings in Head-to-Head AI Combat" [level=2] [ref=f3e121]'
        - paragraph [ref=f3e122]: Evaluating large language models (LLMs) is a complex task. Pairwise ranking, where humans compare LLM outputs based on predefined criteria, has become a leading approach for evaluating LLMs. By aggregating these comparisons through algorithms such as Elo, rankings across multiple large language models (LLMs) can be derived. However, applying ranking algorithms in LLM evaluation presents several challenges. Traditional systems, such as Elo, designed initially for structured competitions like chess, often produce inconsistent and unstable rankings due to the dynamic and context-dependent nature of large language model (LLM) performance. Despite the increasing reliance on these methods, a systematic study of ranking algorithms for LLM evaluation remains lacking. This project examines the effectiveness of various ranking systems for head-to-head LLM comparisons. We defined key principles for robust ranking, conducted extensive evaluations of different ranking algorithms, and analyzed their stability, accuracy, and sensitivity to real-world conditions. Our findings offer insights into the limitations of existing approaches and provide guidelines for selecting the most appropriate ranking method based on evaluation objectives and resource constraints.
        - figure "Different ranking algorithms can produce varying rankings with the same human evaluation data, making it challenging to determine which algorithm is most suitable for various use cases." [ref=f3e123]:
          - generic [ref=f3e124]: Different ranking algorithms can produce varying rankings with the same human evaluation data, making it challenging to determine which algorithm is most suitable for various use cases.
        - paragraph [ref=f3e125]:
          - link "Accepted to ACL 2025" [ref=f3e126] [cursor=pointer]:
            - /url: https://2025.aclweb.org/program/main_papers/
          - text: . Official Paper Link Coming Soon
