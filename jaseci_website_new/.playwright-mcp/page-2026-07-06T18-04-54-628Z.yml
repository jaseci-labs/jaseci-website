      - generic [ref=f3e133]:
        - heading "SLM vs. LLM" [level=2] [ref=f3e134]
        - paragraph [ref=f3e135]: Many companies utilize large language models (LLMs) to develop AI-powered product experiences. Along with the benefits of ease of use and shortened time to solution, this reliance on proprietary services has downsides in model control, performance reliability, uptime predictability, and cost. At the same time, a flurry of open-source small language models (SLMs) has been made available for commercial use. However, their readiness to replace existing capabilities remains unclear, and a systematic approach to holistically evaluate these SLMs is not readily available.
        - paragraph [ref=f3e136]: We present a systematic evaluation methodology and a characterization of modern open-source SLMs, along with their trade-offs, when replacing proprietary LLMs for a real-world product feature.
        - paragraph [ref=f3e137]: Across 9 SLMs and their 29 variants, we observe that SLMs provide competitive results, significant performance consistency improvements, and a cost reduction of 5x to 29x when compared to GPT-4.
        - paragraph [ref=f3e138]:
          - text: To facilitate the systematic evaluation of the above across language models, we have designed
          - strong [ref=f3e139]: SLaM
          - text: . This open-source automated analysis tool enables the qualitative and quantitative assessment of product features using arbitrarily large language models (LLMs) or small language models (SLMs). SLaM is a tool to evaluate the performance of Large Language Models (LLMs) for your personal use cases with the help of Human Evaluation and Automatic Evaluation. You can deploy the application on your local machine or use Docker to generate responses for a given prompt with different LLMs (Proprietary or Open Source), and then evaluate the responses with the help of human evaluators or automated methods.
        - figure [ref=f3e141]
        - paragraph [ref=f3e142]:
          - text: Check out our publication at
          - emphasis [ref=f3e143]: 2024 IEEE International Symposium on Performance Analysis of Systems and Software (ISPASS)
          - text: ": “Scaling Down to Scale Up: A Cost-Benefit Analysis of Replacing OpenAI’s LLM with Open Source SLMs in Production” to find out more."
