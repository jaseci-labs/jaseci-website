        - heading "Jaseci Programming Paradigm" [level=2] [ref=f3e153]
        - paragraph [ref=f3e154]: Today’s production scale-out applications include many sub-application components, such as storage backends, logging infrastructure and AI models. These components have drastically different characteristics, are required to work in collaboration, and interface with each other as microservices. This leads to increasingly high complexity in developing, optimizing, configuring, and deploying scale-out applications, raising the barrier to entry for most individuals and small teams.
        - paragraph [ref=f3e155]:
          - text: We developed a novel co-designed runtime system,
          - strong [ref=f3e156]: Jaseci
          - text: ", and programming language,"
          - strong [ref=f3e157]: Jac
          - text: ", which aims to reduce this complexity. The key design principle throughout Jaseci’s design is to raise the level of abstraction by moving as much of the scale-out data management, microservice componentization, and live update complexity into the runtime stack to be automated and optimized automatically. We use real-world AI applications to demonstrate Jaseci’s benefit for application performance and developer productivity."
        - figure [ref=f3e158]
        - paragraph [ref=f3e159]:
          - text: Check out our publication at
          - emphasis [ref=f3e160]:
            - text: 2023 IEEE
            - emphasis [ref=f3e161]: Computer Architecture Letters
          - text: ": “The Jaseci Programming Paradigm and Runtime Stack: Building Scale-out Production Applications Easy and Fast” to find out more."
