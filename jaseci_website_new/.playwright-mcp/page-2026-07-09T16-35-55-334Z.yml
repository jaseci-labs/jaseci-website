      - generic [ref=e148]:
        - heading "Jac is more efficient than Python and its abstractions." [level=2] [ref=e149]
        - generic [ref=e150]:
          - generic [ref=e151]:
            - button "Your application is unstable, relying on so many abstractions" [ref=e152] [cursor=pointer]:
              - generic [ref=e153]: Your application is unstable, relying on so many abstractions
            - paragraph [ref=e155]: "When you need to change something on the frontend, you need to change something on the backend (and the middleware). Long term maintenance is easy because everything is done with 13x less files: the same app that takes a Python + React stack 13 files is a single .jac file."
          - generic [ref=e156]:
            - button "Jac simplifies wordy prompts to a single line" [ref=e157] [cursor=pointer]:
              - generic [ref=e158]: Jac simplifies wordy prompts to a single line
            - paragraph [ref=e160]: "We know the obvious: coders are the ones coding. So we made a typed syntax, by llm(), that compresses your 500 word prompt into a single line of code, and the compiler derives the prompt from the meaning already in your program."
          - generic [ref=e161]:
            - button "Jac was primarily built for artificial intelligence" [ref=e162] [cursor=pointer]:
              - generic [ref=e163]: Jac was primarily built for artificial intelligence
            - paragraph [ref=e165]: Jac is built today, so that it can acknowledge Artificial Intelligence, Deployments, Cloud Infrastructure, Middleware, everything that came after Python was designed. When it comes to AI, Jac beats Python because the time for Jac was right.
          - generic [ref=e166]:
            - button "Jac’s Object Spatial Programming is optimized for AI" [ref=e167] [cursor=pointer]:
              - generic [ref=e168]: Jac’s Object Spatial Programming is optimized for AI
            - paragraph [ref=e170]: "AI agents face three problems OOP is bad at: memory (scattered across databases, arrays, and caches you manually merge), decision flow (state machines and callback chains you maintain separately from the data), and context filtering (hand-picking what’s relevant for the LLM’s token limit). OSP solves all three structurally: the agent’s memory is just nodes in the graph, the decision flow is the graph topology itself (walk an edge instead of writing an if/else), and context is naturally scoped by where the walker currently sits. Traditional apps have fixed logic you know at compile time, but AI agents make runtime decisions about what to do next; OOP forces you to pre-define every path in code, while OSP lets the agent discover paths by traversing a graph that grows and changes as it reasons."
          - generic [ref=e171]:
            - button "Jac is multiparadigmatic, so it never has to rely on other dependencies" [ref=e172] [cursor=pointer]:
              - generic [ref=e173]: Jac is multiparadigmatic, so it never has to rely on other dependencies
            - paragraph [ref=e175]: "AI apps aren’t one problem. They’re several at once, each fitting a different programming style: OOP to model your domain (users, sessions, documents), functional programming for clean data transforms (chaining LLM outputs, filtering lists without side effects), declarative components for UI (what React uses, describing what the interface looks like, not how to update it), and graph-based traversal for agent reasoning (navigating knowledge, making decisions step by step). In a traditional stack, each paradigm means a separate dependency: Python for OOP, LangChain for agent flows, NetworkX for graphs, React for UI, each with its own install, API, version conflicts, and CVEs. Jac gives you all four natively: obj for domain models, pure functions and comprehensions for data pipelines, cl blocks for React-style declarative components, and walkers on graphs for agent logic, all in the same file, same language, zero external dependencies. Fewer dependencies means less to install, less that breaks, fewer CVEs to patch, and fewer abstractions fighting each other."
