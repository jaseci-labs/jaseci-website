            - paragraph [ref=e426]: "We know the obvious: coders are the ones coding. So we made a typed syntax, by llm(), that compresses your 500 word prompt into a single line of code, and the compiler derives the prompt from the meaning already in your program."
          - generic [ref=e427]:
            - button "Jac was primarily built for artificial intelligence" [ref=e428] [cursor=pointer]:
              - generic [ref=e429]: Jac was primarily built for artificial intelligence
            - paragraph [ref=e431]: Jac is built today, so that it can acknowledge Artificial Intelligence, Deployments, Cloud Infrastructure, Middleware, everything that came after Python was designed. When it comes to AI, Jac beats Python because the time for Jac was right.
          - generic [ref=e432]:
            - button "Jac’s Object Spatial Programming is optimized for AI" [ref=e433] [cursor=pointer]:
              - generic [ref=e434]: Jac’s Object Spatial Programming is optimized for AI
            - paragraph [ref=e436]: "AI agents face three problems OOP is bad at: memory (scattered across databases, arrays, and caches you manually merge), decision flow (state machines and callback chains you maintain separately from the data), and context filtering (hand-picking what’s relevant for the LLM’s token limit). OSP solves all three structurally: the agent’s memory is just nodes in the graph, the decision flow is the graph topology itself (walk an edge instead of writing an if/else), and context is naturally scoped by where the walker currently sits. Traditional apps have fixed logic you know at compile time, but AI agents make runtime decisions about what to do next; OOP forces you to pre-define every path in code, while OSP lets the agent discover paths by traversing a graph that grows and changes as it reasons."
          - generic [ref=e437]:
            - button "Jac is multiparadigmatic, so it never has to rely on other dependencies" [ref=e438] [cursor=pointer]:
              - generic [ref=e439]: Jac is multiparadigmatic, so it never has to rely on other dependencies
            - paragraph [ref=e441]: "AI apps aren’t one problem. They’re several at once, each fitting a different programming style: OOP to model your domain (users, sessions, documents), functional programming for clean data transforms (chaining LLM outputs, filtering lists without side effects), declarative components for UI (what React uses, describing what the interface looks like, not how to update it), and graph-based traversal for agent reasoning (navigating knowledge, making decisions step by step). In a traditional stack, each paradigm means a separate dependency: Python for OOP, LangChain for agent flows, NetworkX for graphs, React for UI, each with its own install, API, version conflicts, and CVEs. Jac gives you all four natively: obj for domain models, pure functions and comprehensions for data pipelines, cl blocks for React-style declarative components, and walkers on graphs for agent logic, all in the same file, same language, zero external dependencies. Fewer dependencies means less to install, less that breaks, fewer CVEs to patch, and fewer abstractions fighting each other."
