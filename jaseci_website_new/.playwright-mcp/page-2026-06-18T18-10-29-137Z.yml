    - generic [ref=e88]:
      - generic [ref=e89]: The Ask
      - heading "Developers needed more." [level=2] [ref=e90]
      - paragraph [ref=e91]: "They came to me for one thing — agentic AI. And Jac was good at it. But an agent is just one corner of what they were really building: the app around it, the data beneath it, the scale, the deploy. They didn’t want a tool for the workflow. They wanted all of it — and a language I’d built only for agents was never going to be enough."
      - paragraph [ref=e92]: And there was a harder problem underneath. In production Jac was still slow, because for everything beyond the agent it leaned on other tools. Every dependency it reached for dragged on it — the language I’d built was paying the price for what it couldn’t do on its own.
      - paragraph [ref=e93]: So what was I supposed to do? Not hand developers a better tool among tools. I had to make Jac itself the leap — the same one the world made when it went from Assembly to C, where the new language doesn’t sit on top of the old one, it becomes the ground everything is built on. How do you turn a language into the next evolutionary step?
