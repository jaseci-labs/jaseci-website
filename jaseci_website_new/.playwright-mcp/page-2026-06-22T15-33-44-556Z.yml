          - paragraph [ref=e132]: "Jac was good at building an agentic AI, but developers weren’t just building AI alone. Developers were building applications, including the data, the scale, and the deployment. This highlighted a large problem: Jac was too slow in production, and after a lengthy analysis, the problem was dependency on third-party tools to fill those potholes. We designed Jac to be that evolutionary leap; how do you turn a language into the next evolutionary step?"
