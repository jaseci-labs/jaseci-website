      - generic [ref=e46]:
        - heading "Python, LangChain, they’re all broken." [level=2] [ref=e47]
        - paragraph [ref=e48]: Python became the home of Machine Learning, not Artificial Intelligence. But companies pretend like it was born for it. They pancake libraries and frameworks on top, constantly abstracting over a language never designed to build agents. That’s why no matter how hard companies try, these tools are always sh*tty.
        - paragraph [ref=e49]: Instead of abstraction, let’s build a language that's aware of the advancements in the past year. So, instead of an OOP agent wrangling its own state, an OSP walker collapses everything into a single graph traversal, running 4.75x faster at runtime and built 3.2x faster by developers. Instead of a 500-word prompt, let’s use byLLM in a single line (that’s developer-friendly :D ). Jac is the language built for pro-AI communities today.
